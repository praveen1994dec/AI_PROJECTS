name: AI Agent - Auto-Fix Build Failures

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && !startsWith(github.event.workflow_run.head_branch, 'auto-fix/') }}
    runs-on: ubuntu-latest

    env:
      MAX_DAILY_RUNS: 5
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 20
          token: ${{ secrets.GH_PAT }}

      - name: Check rate limits
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          # Fetch total runs triggered today for this specific workflow
          RUN_COUNT=$(gh run list --workflow=ci-agent-fix.yml --created="$TODAY" --json id --jq 'length')

          echo "Total runs today ($TODAY): $RUN_COUNT / $MAX_DAILY_RUNS"

          if [ "$RUN_COUNT" -ge "$MAX_DAILY_RUNS" ]; then
            echo "::warning ::Daily budget limit reached ($MAX_DAILY_RUNS runs). Skipping AI fix generation."
            exit 0
          fi

      - name: Fetch failed workflow logs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "Fetching failed logs for workflow run: $RUN_ID"
          
          # 1. Try to fetch logs only for failed steps
          gh run view "$RUN_ID" --log-failed > /tmp/error.log || true

          # 2. Fallback: If --log-failed returns empty, fetch tail of standard logs
          if [ ! -s /tmp/error.log ]; then
            echo "Failed logs empty or unavailable. Fetching full run log tail..."
            gh run view "$RUN_ID" --log | tail -n 500 > /tmp/error.log || echo "No logs captured."
          fi

      - name: Extract git context
        id: extract
        run: |
          DIFF=$(git diff HEAD^ HEAD --unified=5 || echo "No diff available")
          CHANGED_FILES=$(git diff HEAD^ HEAD --name-only || echo "")

          echo "$DIFF" > /tmp/diff.txt
          echo "$CHANGED_FILES" > /tmp/changed.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install anthropic

      - name: Call AI agent for fix
        id: ai-fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_OUTPUT: ${{ env.GITHUB_OUTPUT }}
        run: python agent.py


      - name: Apply fix and create PR
        if: steps.ai-fix.outputs.has_fix == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH="auto-fix/${{ github.event.workflow_run.head_branch }}-$(date +%s)"

          git config user.name "CI Auto-Fix Bot"
          git config user.email "ci-bot@users.noreply.github.com"

          git checkout -b "$BRANCH"
          
          git apply /tmp/proposed-fix.patch 
          git add -A
          git commit -m "fix(ci): automated patch for pipeline run ${{ github.event.workflow_run.id }}"
          git push origin "$BRANCH"

          CONFIDENCE=$(cat /tmp/confidence.txt 2>/dev/null || echo "UNKNOWN")

          gh pr create \
            --title "🤖 [Auto-Fix] Resolves CI failure on ${{ github.event.workflow_run.head_branch }}" \
            --body "## CI Auto-Fix Proposal 🛠️

          The CI agent detected a failure in workflow run [#${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }}).

          * **Confidence Level:** \`$CONFIDENCE\`
          * **Base Branch:** \`${{ github.event.workflow_run.head_branch }}\`

          > Please review the diff carefully before merging." \
            --draft \
            --base "${{ github.event.workflow_run.head_branch }}"