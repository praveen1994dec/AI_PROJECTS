apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/akashkayande/MicroServices-DevOps-AIops.git'
    targetRevision: main
    path: deployment/gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: boutique
  syncPolicy: 
    automated:
      prune: true
      selfHeal: true


    